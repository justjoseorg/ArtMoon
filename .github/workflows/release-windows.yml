---
name: Release - Windows Installer
permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    uses: ./.github/workflows/build-windows-installer.yml
    with:
      release_tag: ${{ github.ref_name }}

  attach:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download built installer
        uses: actions/download-artifact@v4
        with:
          name: ArtMoon-installer-${{ github.ref_name }}
          path: installer

      - name: Check the asset name before it is published
        run: |
          # GitHub cannot rename a release asset, and the updater matches
          # ^ArtMoon_(\d+(\.\d+){1,3})_Installer\.exe$ with that version equal
          # to the release tag (app/backend/appupdate.cpp). The name used to be
          # lost by hand at upload, which left every Windows user unable to
          # update in the app while the UI still said a newer version existed.
          # Attachment is the last moment this can be caught.
          want="ArtMoon_${GITHUB_REF_NAME#v}_Installer.exe"
          got="$(basename "$(ls installer/*.exe | head -1)")"
          echo "expected: $want"
          echo "found:    $got"
          if [ "$got" != "$want" ]; then
            echo "::error::installer is '$got' but the updater needs '$want'"
            exit 1
          fi

      - name: Attach the installer to the release
        uses: softprops/action-gh-release@v2
        with:
          files: installer/*.exe
