name: Build ArtMoon Android APK

permissions:
  contents: write

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Decode signing keystore
        if: env.ARTMOON_KEYSTORE_B64 != ''
        env:
          ARTMOON_KEYSTORE_B64: ${{ secrets.ARTMOON_KEYSTORE_B64 }}
        run: |
          echo "$ARTMOON_KEYSTORE_B64" | base64 -d > /tmp/artmoon.keystore
          echo "ARTMOON_KEYSTORE=/tmp/artmoon.keystore" >> "$GITHUB_ENV"

      - name: Build nonRoot release APK
        working-directory: android
        env:
          ARTMOON_KEYSTORE_PASSWORD: ${{ secrets.ARTMOON_KEYSTORE_PASSWORD }}
          ARTMOON_KEY_ALIAS: ${{ secrets.ARTMOON_KEY_ALIAS }}
          ARTMOON_KEY_PASSWORD: ${{ secrets.ARTMOON_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleNonRootRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ArtMoon-Android-${{ github.ref_name }}
          path: android/app/build/outputs/apk/nonRoot/release/*.apk

      # Every release so far has carried the APK as ArtMoon-<ver>-android.apk,
      # but gradle's raw name (app-nonRoot-release.apk) is what reached the
      # release page whenever this was done by hand - and a published asset
      # cannot be renamed. Name it here, and refuse outright if the version in
      # app/version.txt is not the tag being released: that is a forgotten bump.
      - name: Name the APK for the release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VER="$(cat app/version.txt)"
          if [ "v${VER}" != "${{ github.ref_name }}" ]; then
            echo "app/version.txt says '${VER}' but the tag is '${{ github.ref_name }}' - refusing to attach a misnamed asset"
            exit 1
          fi
          mkdir -p release-assets
          cp android/app/build/outputs/apk/nonRoot/release/*.apk "release-assets/ArtMoon-${VER}-android.apk"
          ls -l release-assets

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          # Stay a draft: the release is published in one step, once every asset
          # is attached, so its page never shows notes with nothing to download.
          # Left off, this action finalises (publishes) a draft by itself.
          draft: true
          files: release-assets/*.apk
