---
name: Build - macOS DMG
permissions:
  contents: read

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      release_tag:
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'libs/mac/**'
      - 'scripts/generate-dmg.sh'
      - 'moonlight-qt.pro'
      - '.github/workflows/build-macos.yml'

jobs:
  build:
    # macos-15 is Apple silicon, and `file` reports every library committed under
    # libs/mac/lib as a universal binary — x86_64 AND arm64 — so the one universal
    # build QMAKE_APPLE_DEVICE_ARCHS asks for links on both. The runner's own
    # architecture does not decide the artifact's.
    runs-on: macos-15
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5
        with:
          submodules: 'recursive'
          fetch-depth: 1

      - name: Install create-dmg
        # create-dmg is the packager scripts/generate-dmg.sh calls; it is a Node
        # CLI, and the runner image ships neither it nor node.
        run: |
          brew install node
          npm install --global create-dmg

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          cache: true
          # Pinned to the same Qt the Linux AppImage is built against, so the two
          # platforms cannot disagree about what the app's QML is compiled for.
          version: 6.8.3
          set-env: true
          add-tools-to-path: true

      - name: Build and package
        # No SIGNING_IDENTITY and no NOTARY_KEYCHAIN_PROFILE are set, and
        # generate-dmg.sh treats both as optional: it skips codesign and
        # notarytool entirely and produces a plain UNSIGNED DMG. That omission is
        # the whole reason this can run without a $99 Apple Developer account —
        # it is a deliberate choice, not something left unfinished. The cost is
        # one Gatekeeper prompt on the user's first launch, which the README
        # documents.
        run: bash scripts/generate-dmg.sh Release

      - name: Upload DMG
        uses: actions/upload-artifact@v6
        with:
          name: ArtMoon-macOS${{ inputs.release_tag != '' && format('-{0}', inputs.release_tag) || '' }}
          path: build/installer-Release/*.dmg
          # The dmg is already a compressed image; compressing it again buys
          # nothing and costs minutes.
          compression-level: 0
          if-no-files-found: error
